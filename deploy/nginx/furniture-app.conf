# Nginx site config for the DigitalOcean droplet (backend only —
# frontend is hosted on Vercel, this box just serves the API).
# Copy to /etc/nginx/sites-available/furniture-api, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Replace YOUR_API_DOMAIN with your DuckDNS subdomain (or real domain later),
# e.g. api-furniture.duckdns.org — this stays separate from the Vercel
# domain the frontend lives on.
# Run `sudo certbot --nginx -d YOUR_API_DOMAIN` afterwards to add HTTPS —
# certbot rewrites this file to add the 443 server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_API_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
